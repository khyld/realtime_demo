[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bilingual-realtime-lab"
version = "0.1.0"
description = "Danish and English GPT Realtime lab with Azure AI Search grounding"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12.0",
    "azure-identity>=1.24.0",
    "azure-search-documents>=11.6.0",
    "azure-storage-blob>=12.26.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.10.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]